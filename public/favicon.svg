<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdfaf2"/>
      <stop offset="100%" stop-color="#f5e9c8"/>
    </linearGradient>
    <linearGradient id="seal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9b2226"/>
      <stop offset="100%" stop-color="#7a1b1f"/>
    </linearGradient>
  </defs>

  <!-- paper background -->
  <rect x="2" y="2" width="60" height="60" rx="12" ry="12"
        fill="url(#bg)" stroke="#c9a341" stroke-width="2"/>

  <!-- inner gold border -->
  <rect x="6" y="6" width="52" height="52" rx="9" ry="9"
        fill="none" stroke="#c9a341" stroke-width="0.8" opacity="0.55"/>

  <!-- 中 character, brush-style -->
  <g fill="#1a1209">
    <!-- horizontal box -->
    <rect x="17" y="20" width="30" height="22" rx="1.5" ry="1.5"
          fill="none" stroke="#1a1209" stroke-width="4.2" stroke-linejoin="round"/>
    <!-- vertical stroke through middle -->
    <rect x="29.6" y="10" width="4.8" height="44" rx="1.2" ry="1.2"/>
  </g>

  <!-- red seal in corner -->
  <rect x="44" y="44" width="14" height="14" rx="2" ry="2"
        fill="url(#seal)" stroke="#5a1115" stroke-width="0.6"/>
  <text x="51" y="55" text-anchor="middle"
        font-family="'Noto Serif SC','Songti SC',serif"
        font-size="11" font-weight="700" fill="#fdfaf2">汉</text>
</svg>
